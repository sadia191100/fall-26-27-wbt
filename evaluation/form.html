<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <h2>Donor Information</h2>
        <table>
            <!--First name-->

            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" name="fname" required></td>
            </tr>
            <!--Lirst name-->

            <tr>
                <td><label for="Lname">First Name:</label></td>
                <td><input type="text" name="Lname" required></td>
            </tr>
            <!--Company-->
            <tr>
                <td><label for="com">Company:</label></td>
                <td><input type="text" name="com" required></td>
            </tr>

            <!--Address 1-->
            <tr>
                <td><label for="address">Address 1:</label></td>
                <td><input type="text" name="address1" required></td>
            </tr>
            <!--Address 2-->
            <tr>
                <td><label for="address">Address 2:</label></td>
                <td><input type="text" name="address2" required></td>
            </tr>
            <!--City-->
            <tr>
                <td><label for="city">City:</label></td>
                <td><input type="text" name="city" required></td>
            </tr>
            <!--State-->
            <tr>
                <td><label for="state">State:</label></td>
                <td>
                    <select id="State" name="State">

                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Gopalganj</option>
                        <option>khulna</option>
                    </select>

                </td>
            </tr>

            <!--Country-->
            <tr>
                <td><label for="country">Country:</label></td>
                <td>
                    <select id="Country" name="Country">

                        <option>Select a State</option>
                        <option>UK</option>
                        <option>Argentina</option>
                        <option>USA</option>
                    </select>

                </td>
            </tr>

        </table>

    </fieldset>

</body>

</html>
